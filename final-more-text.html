<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine ♡</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  overflow:hidden;font-family:system-ui,sans-serif;color:#56334b;
  background:
    radial-gradient(ellipse at 15% 20%,#ffd6ec,transparent 45%),
    radial-gradient(ellipse at 85% 80%,#d3b8ff,transparent 48%),
    linear-gradient(135deg,#c98bf0,#e58fc4,#b57bee);
}
.glow{position:fixed;width:260px;height:260px;border-radius:50%;
filter:blur(65px);opacity:.4;pointer-events:none}
.one{top:-100px;right:-80px;background:#ffb4d2}
.two{bottom:-100px;left:-80px;background:#c9b7ff}
.card{
  position:relative;z-index:2;width:min(90%,430px);
  padding:38px 24px;text-align:center;
  background:linear-gradient(160deg,#ffe3f4,#e9d6ff);
  border:1px solid #ffffff;border-radius:30px;
  box-shadow:0 24px 70px #7f4b701f;
}
.animal{
  width:140px;height:140px;margin:0 auto 14px;
  border-radius:16px;overflow:hidden;
  border:4px solid white;
  box-shadow:0 10px 30px #b06a9430;
  animation:bob 3.2s ease-in-out infinite;
  line-height:0;
}
.animal img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes bob{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}
h1{font-size:clamp(27px,7vw,36px);margin:5px 0 14px}
h1 span{color:#c94f8e}
p{color:#7a5f7f;line-height:1.9;margin:0 auto 25px}
.buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
button{
  border:0;border-radius:50px;padding:13px 22px;
  font:inherit;font-weight:750;cursor:pointer;
  transition:transform .35s ease,background .35s ease,box-shadow .2s;
}
#yes{color:white;background:linear-gradient(135deg,#ff5598,#ff91bd);
box-shadow:0 8px 22px #ff7eae55}
#yes:hover{transform:translateY(-3px)}
#no{background:#ffffffcc;color:#76576c}
#no.become-yes{
  color:white;background:linear-gradient(135deg,#ff5598,#ff91bd);
  box-shadow:0 8px 22px #ff7eae55;
}
#message{
  display:none;margin-top:23px;padding:16px 10px;
  background:#ffffffb0;color:#bd3379;border-radius:18px;
  font-weight:800;line-height:1.9;
  animation:pop .45s ease-out;
}
@keyframes pop{
  from{opacity:0;transform:scale(.7)}
  to{opacity:1;transform:scale(1)}
}
#burst{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.float-text{
  position:absolute;left:var(--x);top:var(--y);
  padding:9px 16px;border-radius:20px;
  background:#fff;color:#c94f8e;
  border:2px solid #ff9fc9;
  box-shadow:0 4px 14px #b06a9430;
  font-weight:850;font-size:15px;
  white-space:nowrap;
  animation:popin .22s ease-out both;
}
@keyframes popin{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  70%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
.flash{position:fixed;inset:0;background:white;z-index:4;
pointer-events:none;animation:flash .5s forwards}
@keyframes flash{to{opacity:0}}
</style>
</head>
<body>
<div class="glow one"></div>
<div class="glow two"></div>

<main class="card">
  <div class="animal">
    <img src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif"
         alt="GIF แมวจริงน่ารัก"
         loading="lazy"
         onerror="this.outerHTML='🐱💗'">
  </div>
  <h1>เป็นแฟนกันนะ <span>💗</span></h1>
  <p>มีเรื่องอยากบอกมานานแล้ว<br>
  เธอจะลองเปิดใจให้เราได้ไหม?</p>

  <div class="buttons">
    <button id="yes">ตกลง 💗</button>
    <button id="no">ไม่เอา 🙈</button>
  </div>

  <div id="message">
    เย้! 💖 ตกลงแล้วนะ<br>
    จากนี้ขอให้เราดูแลเธอได้ไหม ♡
  </div>
</main>

<div id="burst"></div>

<script>
const yes = document.getElementById('yes');
const no = document.getElementById('no');
const message = document.getElementById('message');
const burst = document.getElementById('burst');

let accepted = false;
let noCount = 0;

const noColors = [
  '#ff963d','#ff854e','#ff7188','#e96b9d','#d95fb0',
  '#c457c9','#a95fd6','#8f66e0','#7a6ce8','#6a6ff0'
];

const noTexts = [
  'คิดอีกทีน้า 🥺','แน่ใจเหรอ 💗','ขอโอกาสหน่อย 🙈',
  'ไม่ใจร้ายสิ 🥺','อีกครั้งน้า 💗','คิดดี ๆ นะ',
  'ใจเย็น ๆ ก่อน','ยังไม่ปิดโอกาสนะ','ขอสักครั้ง 🥺','ครั้งสุดท้ายแล้วนะ 💗'
];

no.addEventListener('click', () => {
  if (accepted) return;
  noCount++;

  if (noCount <= 10) {
    no.textContent = noTexts[Math.min(noCount - 1, noTexts.length - 1)];
    no.style.background = noColors[Math.min(noCount - 1, noColors.length - 1)];
    no.style.color = '#fff';

    no.style.transform =
      `translate(${(Math.random()-.5)*18}px,${(Math.random()-.5)*10}px)`;

    if (noCount === 10) {
      document.body.classList.add('final');
    }
    return;
  }

  no.classList.add('become-yes');
  no.textContent = 'ตกลง 💗';
  no.style.transform = 'scale(1.08)';
  setTimeout(() => no.style.transform = '', 350);
});

no.addEventListener('click', () => {
  if (!accepted && no.classList.contains('become-yes')) {
    accept();
  }
});

yes.addEventListener('click', () => {
  if (!accepted) accept();
});

function accept(){
  if (accepted) return;
  accepted = true;

  message.style.display = 'block';
  yes.textContent = 'ตกลงแล้วนะ 💞';
  no.style.display = 'none';

  const flash = document.createElement('div');
  flash.className = 'flash';
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 550);

  const words = [
    'YES! 💗','OK! ✨','รักนะ ♡','ตกลง!',
    'เย้! 💖','💖💖💖','แฟนกันนะ','LOVE U',
    'ดีใจที่สุด!','หัวใจของเรา ♡'
  ];

  for (let i = 0; i < 80; i++) {
    setTimeout(()=>{
      const el = document.createElement('span');
      el.className = 'float-text';
      el.textContent = words[Math.floor(Math.random()*words.length)];

      el.style.setProperty('--x', (5+Math.random()*90)+'vw');
      el.style.setProperty('--y', (5+Math.random()*90)+'vh');

      burst.appendChild(el);
      setTimeout(() => el.remove(), 1200);
    }, i*55);
  }
}
</script>
</body>
</html>
