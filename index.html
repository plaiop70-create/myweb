<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>คุณเป็นเพศอะไร</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;font-family:Tahoma,sans-serif;color:#fff;background:#0c0920;display:grid;place-items:center;padding:24px;overflow-x:hidden}.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 12% 15%,#60328388,transparent 55%),radial-gradient(ellipse at 90% 85%,#244cc277,transparent 55%)}.orb{position:absolute;width:65vw;height:65vw;border-radius:50%;filter:blur(65px);opacity:.3;background:#ff65be;top:-20%;left:-15%;animation:float 12s ease-in-out infinite alternate}.orb.two{background:#628bff;top:60%;left:60%;animation-delay:-6s}.dots{position:absolute;inset:0;background-image:radial-gradient(#fff8 1px,transparent 1px);background-size:58px 58px;opacity:.25}@keyframes float{to{transform:translate(70px,70px)}}main{position:relative;width:min(100%,580px);text-align:center;padding:42px 22px;border:1px solid #ffffff25;border-radius:32px;background:linear-gradient(145deg,#ffffff12,#ffffff05);box-shadow:0 30px 100px #0006;backdrop-filter:blur(20px)}.small{font-size:11px;letter-spacing:5px;color:#d5c9ff;margin-bottom:20px}h1{font-size:clamp(27px,7vw,42px);margin:0 0 14px;line-height:1.4}.sub{color:#c1b9d5;font-size:14px;margin-bottom:34px}.choices{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}.choice{padding:26px 8px;border-radius:24px;border:1px solid #ffffff35;color:white;transition:transform .2s,box-shadow .2s;min-width:0}.choice:hover{transform:translateY(-5px)}.choice:active{transform:scale(.96)}.female{background:linear-gradient(145deg,#db5fa1aa,#8b3d9988);box-shadow:0 10px 35px #f269b11a}.male{background:linear-gradient(145deg,#648ae7aa,#45439f88);box-shadow:0 10px 35px #648ae71a}.symbol{display:block;font-family:Arial,sans-serif;font-size:54px;margin-bottom:14px}.name{font-size:18px}.or{font-size:14px;color:#c6badd;font-style:italic}.footer{margin-top:30px;color:#a99cbb;font-size:12px}#result{animation:show .5s ease both}.emoji{font-size:62px;margin:8px 0 24px}#message{font-size:clamp(26px,7vw,38px);line-height:1.65;overflow-wrap:anywhere;text-shadow:0 0 28px #efa4ff55}.back{margin-top:28px;padding:12px 24px;border:1px solid #ffffff35;color:#eee;background:#ffffff0c;border-radius:30px;font-size:14px}[hidden]{display:none!important}@keyframes show{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="bg"><div class="orb"></div><div class="orb two"></div><div class="dots"></div></div><main><section id="question"><div class="small">JUST ONE QUESTION</div><h1>คุณเป็นเพศอะไร</h1><p class="sub">เลือกคำตอบของคุณด้านล่าง</p><div class="choices"><button class="choice female" id="female"><span class="symbol">♀</span><span class="name">ผู้หญิง</span></button><span class="or">or</span><button class="choice male" id="male"><span class="symbol">♂</span><span class="name">ผู้ชาย</span></button></div><div class="footer">✦ แตะเพื่อดูข้อความ ✦</div></section><section id="result" hidden aria-live="polite"><div class="emoji" id="emoji"></div><h1 id="message"></h1><button class="back" id="back">← กลับไปเลือกใหม่</button></section></main><script>
const q=document.getElementById('question'),r=document.getElementById('result'),m=document.getElementById('message'),e=document.getElementById('emoji');function show(text,emoji){m.textContent=text;e.textContent=emoji;q.hidden=true;r.hidden=false;document.getElementById('back').focus()}document.getElementById('female').onclick=()=>show('เข้ามาดูชอบเราป่ะ','💗');document.getElementById('male').onclick=()=>show('เสือกเหี้ยไร','🤨');document.getElementById('back').onclick=()=>{r.hidden=true;q.hidden=false;document.getElementById('female').focus()};
</script></body></html>
