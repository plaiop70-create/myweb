<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RATPOL</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;800&family=Bungee&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Prompt',system-ui,sans-serif;background:#05060f;color:#f3f4f6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}
.nebula{position:fixed;inset:-20%;z-index:-3;background:#05060f}
.b{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 18s ease-in-out infinite}
.b1{width:420px;height:420px;background:#7c3aed;top:-80px;left:-80px}
.b2{width:380px;height:380px;background:#ec4899;bottom:-100px;right:-80px;animation-delay:4s}
.b3{width:300px;height:300px;background:#3b82f6;top:45%;left:55%;animation-delay:8s}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-40px) scale(1.15)}}
.stars{position:fixed;inset:0;z-index:-2}
.s{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.8}}
.glow{position:fixed;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#a855f722,transparent 70%);pointer-events:none;z-index:-1;transform:translate(-50%,-50%);transition:.12s}
.card{width:100%;max-width:380px;text-align:center;background:#ffffff0d;border:1px solid #ffffff1a;border-radius:36px;padding:40px 28px 30px;box-shadow:0 20px 50px #0008;backdrop-filter:blur(10px)}
.avatar-wrap{position:relative;width:130px;height:130px;margin:0 auto 18px}
.ring{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,#a855f7,#ec4899,#a855f7);animation:spin 8s linear infinite;filter:blur(5px);opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:3px solid #ffffff1f;box-shadow:0 8px 24px #0007}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.status{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:#a7f3d0;background:#10b98118;border:1px solid #10b98133;border-radius:999px;padding:4px 12px}
.dot{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
h1{font-family:'Bungee',cursive;font-size:34px;letter-spacing:3px;margin:14px 0 6px;background:linear-gradient(90deg,#fff,#ffd6f5,#a5f3fc,#fde047,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite,float 4s ease-in-out infinite;filter:drop-shadow(0 0 14px #a855f755)}
@keyframes shine{to{background-position:300% 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.underline{width:90px;height:3px;margin:0 auto 14px;border-radius:999px;background:linear-gradient(90deg,#a855f7,#ec4899);box-shadow:0 0 12px #a855f766}
.sub{font-size:13px;color:#9ca3af;margin-top:6px}
.divider{width:60%;height:1px;background:linear-gradient(90deg,transparent,#ffffff2e,transparent);margin:22px auto}
.links{display:flex;flex-direction:column;gap:14px}
a{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px 22px;border-radius:999px;text-decoration:none;color:#fff;font-weight:700;font-size:15px;transition:.25s}
a:hover{transform:translateY(-4px)}
.ig{background:linear-gradient(90deg,#f58529,#dd2a7b,#8134af)}
.dc{background:linear-gradient(90deg,#5865f2,#4752c4)}
a svg{width:22px;height:22px;flex:none}
.foot{margin-top:24px;font-size:9px;color:#6b7280;letter-spacing:1px}
</style></head><body>
<div class="nebula"><div class="b b1"></div><div class="b b2"></div><div class="b b3"></div></div>
<div class="stars" id="stars"></div><div class="glow" id="glow"></div>
<div class="card">
<div class="avatar-wrap"><div class="ring"></div><div class="avatar"><img src="https://media.giphy.com/media/PNvMS9cAfhXgSZB6nw/giphy.gif" alt="RATPOL"></div></div>
<h1>RATPOL</h1><div class="underline"></div>

</div>
<script>
const st=document.getElementById('stars');
for(let i=0;i<50;i++){const d=document.createElement('div');d.className='s';d.style.left=Math.random()*100+'vw';d.style.top=Math.random()*100+'vh';d.style.animationDelay=(Math.random()*4)+'s';d.style.animationDuration=(3+Math.random()*3)+'s';st.appendChild(d);}

</body></html>
